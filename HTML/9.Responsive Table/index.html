<!DOCTYPE html>
<html>
<head>
    <title>Responsive Employee Salary Table</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body{
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
        }

        .table-container{
            overflow-x: auto;
        }

        table{
            width: 100%;
            border-collapse: collapse;
            background-color: white;
        }

        caption{
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        thead{
            background-color: #4CAF50;
            color: white;
        }

        th, td{
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }

        tbody tr:nth-child(even){
            background-color: #f2f2f2;
        }

        @media screen and (max-width: 600px){
            table,thead,tbody,th,tr, td{
              display: block;
            }
        }
    </style>
</head>
<body>

<div class="table-container">
<table>
    <caption>Employee Salary Details</caption>

    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Department</th>
            <th>Basic Salary</th>
            <th>Bonus</th>
            <th>Total Salary</th>
        </tr>
    </thead>

    <tbody>
        <tr>
            <td>101</td>
            <td>Rahim</td>
            <td>HR</td>
            <td>30000</td>
            <td>5000</td>
            <td>35000</td>
        </tr>

        <tr>
            <td>102</td>
            <td>Karim</td>
            <td>IT</td>
            <td>40000</td>
            <td>7000</td>
            <td>47000</td>
        </tr>

        <tr>
            <td>103</td>
            <td>Salma</td>
            <td>Finance</td>
            <td>35000</td>
            <td>6000</td>
            <td>41000</td>
        </tr>

        <tr>
            <td>104</td>
            <td>Nusrat</td>
            <td>Marketing</td>
            <td>32000</td>
            <td>4000</td>
            <td>36000</td>
        </tr>
    </tbody>

</table>
</div>

</body>
</html>
