<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creating link and list</title>
</head>
<body>
    <a href="https://www.youtube.com/" target="_blank">Youtuve</a>
    <a href="/home.html">Home</a>
    

<h1>Unorder List</h1>
    <ul>
        <li>Mango</li>
        <li>Appale</li>
        <li>Orange</li>
    </ul>


<h1>Order List</h1>
    <ol>
        <li>Mango</li>
        <li>Appale</li>
        <li>Orange</li>
    </ol>

<h1>Nested List</h1>

<ul>
    <li>Fruits
        <ul>
            <li>Appale</li>
            <li>Orange</li>
        </ul>

    </li>
          
    <li>Hobby</li>
</ul>
</body>
</html>
